<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polymaker Panchroma Wall Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <header id="color-pop-display">
            <h1 id="pop-text">Panchroma</h1>
        </header>

        <div id="controls">
            <div id="score-board">Score: <span id="score">0</span></div>
            <div id="timer-board">Time: <span id="time">60</span></div>
        </div>

        <div id="game-board">
            <!-- Hexes will be generated here -->
        </div>

        <button id="start-btn">START GAME</button>

        <!-- Name Entry Modal -->
        <div id="name-modal">
            <div class="modal-content">
                <h2>NEW HIGH SCORE!</h2>
                <p style="color: #ccc;">Enter your name:</p>
                <input type="text" id="player-name-input" maxlength="15" placeholder="NAME">
                <button id="submit-score-btn">SUBMIT</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
